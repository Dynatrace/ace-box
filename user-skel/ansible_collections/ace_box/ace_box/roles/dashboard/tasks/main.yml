---
- name: Create BasicAuth for NGINX Ingress
  block:
    - name: Generate password hash using htpasswd
      shell: echo "{{ dashboard_password }}" | openssl passwd -apr1 -stdin
      register: password_hash_result
      no_log: true
    - set_fact:
        password_encrypted: "{{ password_hash_result.stdout }}"
    - set_fact:
        authb64encoded: "{{ [dashboard_user, password_encrypted] | join(':') | b64encode }}"
  when: ingress_class != "istio"

- name: Create BasicAuth for Istio Ingress
  block:
    - set_fact:
        authb64encoded: "{{ [dashboard_user, dashboard_password] | join(':') | b64encode }}"
  when: ingress_class == "istio"

# Include Dashboard default values
- set_fact:
    include_dashboard_value_file: "{{ role_path }}/templates/default-ext-refs.yml.j2"

- include_tasks: template-values-file.yml

- name: Find all Dashboard Helm values files
  find:
    paths: "{{ role_path }}/files/helm-values"
  register: dashboard_helm_value_files

- name: Create ace namespace
  kubernetes.core.k8s:
    name: ace
    api_version: v1
    kind: Namespace
    state: present

- name: Add label to ace namespace
  kubernetes.core.k8s:
    state: patched
    kind: Namespace
    name: ace
    definition:
      metadata:
        labels:
          monitor: exclude
  #To make it compatible with older versions of kubernetes.core collection in ext use cases
- name: Install using Helm via shell
  ansible.builtin.shell: |
    helm upgrade --install ace-dashboard "{{ role_path }}/files/chart" \
      --namespace "{{ dashboard_namespace }}" \
      --wait \
      --timeout 15m \
      --set domain="{{ ingress_domain }}" \
      --set authb64encoded="{{ authb64encoded }}" \
      --set image="{{ dashboard_image }}" \
      --set ingress.enabled="{{ ingress_class != 'istio' }}" \
      --set ingress.class="{{ ingress_class }}" \
      --set virtualservice.enabled="{{ ingress_class == 'istio' }}" \
      {% for file in dashboard_helm_value_files.files %}
      --values "{{ file.path }}" \
      {% endfor %}
  args:
    executable: /bin/bash
  when: not dashboard_skip_install

- name: Print some dashboard config
  debug:
    msg:
      - "Dashboard URL: {{ ingress_protocol }}://{{ dashboard_domain }}"
      - "Dashboard username: {{ dashboard_user }}"
      - "Dashboard password: {{ dashboard_password }}"

# health check
- include_role:
    name: health-check
    tasks_from: application-availability
  vars:
    application_domain: "{{ dashboard_domain }}"
  when: not dashboard_skip_install
