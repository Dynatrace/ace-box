---
- name: Run common tasks
  ansible.builtin.import_tasks: common.yml

- name: Run mode-specific tasks
  ansible.builtin.include_tasks: "{{ operator_mode }}.yml"
  when: operator_mode in ["applicationMonitoring", "cloudNativeFullStack", "classicFullStack"]

- name: Fail on unknown operator_mode
  ansible.builtin.fail:
    msg: "Unsupported operator_mode='{{ operator_mode }}'. Expected: applicationMonitoring, cloudNativeFullStack, classicFullStack."
  when: operator_mode not in ["applicationMonitoring", "cloudNativeFullStack", "classicFullStack"]
