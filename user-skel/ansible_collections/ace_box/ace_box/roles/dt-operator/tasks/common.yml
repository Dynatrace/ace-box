---
- include_role:
    name: dt-access-token
  vars:
    access_token_var_name: "{{ dt_operator_dt_access_token_name }}"
    access_token_scope:
      ["DataExport", "InstallerDownload", "activeGateTokenManagement.create", "entities.read", "settings.read", "settings.write"]

- include_role:
    name: dt-access-token
  vars:
    access_token_var_name: "{{ dt_operator_dt_data_ingest_token_name }}"
    access_token_scope: ["metrics.ingest"]

- name: Create Dynatrace namespace
  kubernetes.core.k8s:
    name: "{{ dt_operator_namespace }}"
    api_version: v1
    kind: Namespace
    state: present

- name: Ensure role files directory exists
  ansible.builtin.file:
    path: "{{ role_path }}/files"
    state: directory
