---
- name: Download dynatrace-operator manifest
  ansible.builtin.get_url:
    url: "https://github.com/Dynatrace/dynatrace-operator/releases/download/{{ dt_operator_release }}/kubernetes.yaml"
    dest: "{{ role_path }}/files/dt_operator.yaml"
    mode: "0664"

- name: Apply dynatrace-operator manifest
  kubernetes.core.k8s:
    state: present
    src: "{{ role_path }}/files/dt_operator.yaml"
  register: dt_operator
  retries: 20
  delay: 5
  until: dt_operator is not failed

- name: Download CSI manifest
  ansible.builtin.get_url:
    url: "https://github.com/Dynatrace/dynatrace-operator/releases/download/{{ dt_operator_release }}/kubernetes-csi.yaml"
    dest: "{{ role_path }}/files/dt_operator-csi.yaml"
    mode: "0664"

- name: Apply CSI manifest
  kubernetes.core.k8s:
    state: present
    src: "{{ role_path }}/files/dt_operator-csi.yaml"
  register: dt_operator_csi
  retries: 20
  delay: 5
  until: dt_operator_csi is not failed

- name: Template Dynakube manifest (classicFullStack)
  ansible.builtin.template:
    src: "classicFullStack.yaml.j2"
    dest: "{{ role_path }}/files/classicFullStack.yaml"
    owner: "{{ ace_box_user }}"
    group: "{{ ace_box_user }}"
    mode: "0644"

- name: Apply Dynakube manifest (classicFullStack)
  kubernetes.core.k8s:
    state: present
    src: "{{ role_path }}/files/classicFullStack.yaml"
  register: dynakube
  retries: 20
  delay: 20
  until: dynakube is not failed

- name: Wait for OneAgent pod creation
  kubernetes.core.k8s_info:
    kind: Pod
    namespace: dynatrace
    label_selectors:
      - "app.kubernetes.io/name=oneagent"
  register: dt_oneagent_pods_creation
  until: dt_oneagent_pods_creation.resources | length > 0
  retries: 20
  delay: 20

- name: Wait for ActiveGate pod creation
  kubernetes.core.k8s_info:
    kind: Pod
    namespace: dynatrace
    label_selectors:
      - "app.kubernetes.io/name=activegate"
  register: dt_activegate_pods_creation
  until: dt_activegate_pods_creation.resources | length > 0
  retries: 20
  delay: 20

- name: Ensure OneAgent pods ready
  kubernetes.core.k8s_info:
    kind: Pod
    namespace: dynatrace
    label_selectors:
      - "app.kubernetes.io/name=oneagent"
  register: dt_oneagent_pods
  until: >
    dt_oneagent_pods.resources
    | selectattr('status.phase', 'equalto', 'Running')
    | map(attribute='status.containerStatuses')
    | selectattr('0.ready', 'equalto', true)
    | length == dt_oneagent_pods.resources | length
  retries: 20
  delay: 20

- name: Ensure ActiveGate pods ready
  kubernetes.core.k8s_info:
    kind: Pod
    namespace: dynatrace
    label_selectors:
      - "app.kubernetes.io/name=activegate"
  register: dt_activegate_pods
  until: >
    dt_activegate_pods.resources
    | selectattr('status.phase', 'equalto', 'Running')
    | map(attribute='status.containerStatuses')
    | selectattr('0.ready', 'equalto', true)
    | length == dt_activegate_pods.resources | length
  retries: 20
  delay: 20
