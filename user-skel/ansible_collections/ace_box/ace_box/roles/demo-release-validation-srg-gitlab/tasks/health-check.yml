- name: Trigger pipeline
  include_role:
    name: gitlab
    tasks_from: trigger-pipeline
  vars:
    usecase_group_name: "{{ gitlab_demo_srg_group }}"
    usecase_repo_name: "{{ gitlab_demo_srg_repo_name }}"
    usecase_git_ref: "main"

- name: Get pipeline status
  include_role:
    name: gitlab
    tasks_from: get-pipeline-status
  when: pipeline_id is defined


